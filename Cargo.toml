[package]
name = "customer-service"
version = "0.1.0"
edition = "2024"

[dependencies]
summer = "0.5"
summer-web = "0.5"
summer-sqlx = { version = "0.5", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

thiserror = "1"
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

tracing = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }

[web.middlewares]
compression = { enable = true }
logger = { enable = true, level = "info" }   # one log line per HTTP request